<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrtoQuest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--bg:#101426;--panel:#202741;--panel2:#2a3350;--line:#41496a;--cream:#fff1cf;--gold:#ffd166;--mint:#6ee7b7;--red:#ff7272;--muted:#aab2cc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
/* Minimal styles kept to preserve layout */
.shell{max-width:980px;margin:18px auto;padding:18px}
.btn{background:var(--panel);border:2px solid var(--line);color:var(--cream);padding:8px 10px;cursor:pointer}
.modebar{display:flex;gap:9px;margin:0 0 16px}
.modebtn{flex:1;text-align:center;background:var(--panel);border:3px solid var(--line);color:var(--cream);padding:12px 8px;font:9px 'Press Start 2P'}
.main{background:linear-gradient(180deg,var(--panel) 0,var(--panel2) 100%);padding:16px;border:3px solid var(--line)}
.label{margin:8px 0}
.answer{display:block;margin:6px 0;padding:10px;border:2px solid var(--line);background:transparent;color:var(--cream);cursor:pointer}
.answer.correct{outline:3px solid #6ee7b7}
.answer.wrong{outline:3px solid #ff7272}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#222;padding:8px 12px;border-radius:4px;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo">✚</div><div><h1>ORTOQUEST</h1></div></div>
  <div class="actions"><button class="btn" id="sound" type="button">♫ SOM: OFF</button></div>
</header>
<section class="hero">
  <div><h2>A TRILHA DO CONHECIMENTO</h2><p>Uma questão por vez. Um passo mais perto da aprovação.</p></div>
</section>
<div class="layout">
  <main class="main" id="screen"></main>
</div>
<div id="toast" class="toast"></div>
</div>
<script>
// Dados e utilitários
const questions = [
  {n:1,q:'Na tuberculose, o acometimento articular é mais frequente no',a:['joelho e no quadril.','ombro e no quadril.','tornozelo e no joelho.','tornozelo e no ombro.'],k:0,e:'O quadril e o joelho são frequentemente acometidos.'},
  {n:2,q:'Na infecção pós-osteossíntese, a maturação do biofilme está relacionada à deposição de',a:['fibronectina.','fibrinogênio.','proteoglicano.','matriz exopolissacarídea.'],k:3,e:'A matriz exopolissacarídea é componente do biofilme.'},
  {n:3,q:'Na síndrome compartimental aguda, as fibras musculares dependentes do metabolismo oxidativo e mais vulneráveis à isquemia são do tipo',a:['I.','IIa.','IIb.','III.'],k:0,e:'As fibras do tipo I são mais dependentes de metabolismo oxidativo.'}
  // ... (demais questões mantidas)
];

const $ = id => document.getElementById(id);
const avatars = [
  {name:'Aprendiz',sprite:'🧙',level:1,color:'#ffd166'},
  {name:'Explorador',sprite:'🥷',level:2,color:'#6ee7b7'},
  {name:'Guardião',sprite:'🦸',level:3,color:'#79b8ff'},
  {name:'Mestre',sprite:'🧑‍🚀',level:4,color:'#ff8fab'}
];
const defaults = {unlockedLevel:1,xp:0,correct:0,avatar:0};
let progress = {...defaults};
try { progress = {...defaults, ...JSON.parse(localStorage.getItem('ortoquest-progress')||'{}')}; } catch (e) { console.warn('localStorage parse failed', e); }
let mode='home', selectedLevel=progress.unlockedLevel, solo=null, duel=null, sound=false;
const levelSize=2;
const levelCount=Math.ceil(questions.length/levelSize);

function save(){try{localStorage.setItem('ortoquest-progress',JSON.stringify(progress));}catch(e){console.warn('localStorage set failed',e);}}
function escapeHtml(s){return String(s).replace(/[&<>"]+/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));}
function setMode(m){mode=m;document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render();}

function updateShell(){
  const avatar=avatars[progress.avatar]||avatars[0];
  // atualizar indicadores simples
}

function render(){
  updateShell();const main=$('screen');document.body.classList.toggle('mode-home',mode==='home');
  if(mode==='home')renderHome(main);else if(mode==='solo')renderSolo(main);else if(mode==='duel')renderDuel(main);else renderCharacter(main);
}

function panel(title,subtitle){
  return `<div class="mainhead"><span class="tag">ORTOQUEST</span><span class="tag gold">${escapeHtml(subtitle)}</span><button class="btn" data-home type="button">⌂ MODOS</button></div><hr class="divider">`;
}

function renderHome(el){
  el.innerHTML = `<div class="homebrand"><div class="homeEmblem">✚</div><div class="pixelTitle">ORTOQUEST</div><div class="screenIntro">Jornada SBOT · aprenda jogando</div></div><div style="margin-top:12px"><button class="btn" data-go="solo" type="button">Iniciar Solo</button> <button class="btn" data-go="duel" type="button">Duelo</button> <button class="btn" data-go="character" type="button">Personagem</button></div>`;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setMode(b.dataset.go));
}

function renderSolo(el){
  if(!solo){
    let cards='';
    for(let i=1;i<=levelCount;i++){
      const unlocked = i<=progress.unlockedLevel;
      cards += `<button class="btn" data-level="${i}" type="button" ${unlocked? '':'disabled'}>NÍVEL ${i}</button> `;
    }
    el.innerHTML = panel('CAMPANHA SOLO','AVENTURA') + `<p class="screenIntro">Avance por etapas, acumule XP e desbloqueie novos trechos do mapa e opções de personagem.</p><div class="levelgrid">${cards}</div><div style="margin-top:12px"><button class="btn" id="startLevel" type="button">Iniciar Nível</button></div>`;
    el.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{ if(Number(b.dataset.level)<=progress.unlockedLevel){ selectedLevel=Number(b.dataset.level); render(); } });
    $('startLevel').onclick = ()=>{ solo={level:selectedLevel,pos:0,answered:false,correct:0,streak:0,done:false}; render(); };
    return;
  }

  if(solo.done){
    const next = solo.level<levelCount;
    el.innerHTML = panel('NÍVEL CONCLUÍDO!','VITÓRIA') + `<div class="menuMessage">Você completou o nível ${solo.level} com ${solo.correct} acerto(s).</div><div style="margin-top:12px"><button class="btn" id="advance" type="button">Avançar</button> <button class="btn" id="retry" type="button">Repetir</button></div>`;
    $('advance').onclick = ()=>{ if(next){ selectedLevel=solo.level+1; progress.unlockedLevel=Math.max(progress.unlockedLevel,selectedLevel); save(); solo=null; render(); } };
    $('retry').onclick = ()=>{ solo={level:solo.level,pos:0,answered:false,correct:0,streak:0,done:false}; render(); };
    return;
  }

  const levelQuestions = questions.slice((solo.level-1)*levelSize, solo.level*levelSize);
  const qi = (solo.level-1)*levelSize + solo.pos;
  const q = levelQuestions[solo.pos];
  const answered = solo.answered;

  el.innerHTML = panel(`MISSÃO ${solo.level} · QUESTÃO ${q.n}`, 'REVISÃO · ORTOPEDIA') + `<div class="label" style="color:var(--mint);margin-top:13px">DESAFIO ${solo.pos+1} DE ${levelQuestions.length}</div><h3>${escapeHtml(q.q)}</h3><div id="answers"></div>`;

  const answersContainer = el.querySelector('#answers');
  q.a.forEach((text,idx)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'answer';
    btn.dataset.answer = idx;
    btn.textContent = text;
    if(!answered){ btn.onclick = ()=>answerSolo(Number(btn.dataset.answer), qi); }
    answersContainer.appendChild(btn);
  });

  if(answered){
    const correctBtn = answersContainer.querySelector(`[data-answer="${q.k}"]`);
    if(correctBtn) correctBtn.classList.add('correct');
    if(!solo.lastCorrect){ const wrongBtn = answersContainer.querySelector(`[data-answer="${solo.lastChoice}"]`); if(wrongBtn) wrongBtn.classList.add('wrong'); }
  }
}

function answerSolo(choice, qi){
  const q = questions[qi];
  const ok = choice === q.k;
  solo.answered = true; solo.lastCorrect = ok; solo.lastChoice = choice; solo.correct += ok?1:0; solo.streak = ok?solo.streak+1:0;
  if(ok){ progress.correct++; progress.xp += 10; }
  save(); render();
}

// Fisher-Yates shuffle
function shuffle(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startDuel(names){
  const indices = questions.map((_,i)=>i);
  const deck = shuffle(indices).slice(0,10);
  duel = {names,score:[0,0],turn:0,deck,started:true,waiting:false,answered:false};
}

function renderDuel(el){
  if(!duel?.started){
    el.innerHTML = panel('DUELO DE ORTOPEDIA','MULTIPLAYER LOCAL') + `<p class="screenIntro">Dois jogadores, cinco rodadas para cada um.</p><div style="margin-top:12px"><button class="btn" id="duelStart" type="button">Iniciar Duelo</button></div>`;
    $('duelStart').onclick = ()=>{ const names = ['Jogador 1','Jogador 2']; startDuel(names); render(); };
    return;
  }

  if(duel.complete){
    const result = duel.score[0]===duel.score[1] ? 'EMPATE!' : `${escapeHtml(duel.names[duel.score[0]>duel.score[1]?0:1])} VENCEU!`;
    el.innerHTML = panel('FIM DE COMBATE','RESULTADO') + `<div>${result}</div><div style="margin-top:12px"><button class="btn" id="duelReset" type="button">Voltar</button></div>`;
    $('duelReset').onclick = ()=>{ duel = null; setMode('home'); };
    return;
  }

  const player = duel.turn % 2;
  const q = questions[duel.deck[duel.turn]];
  if(duel.waiting){
    el.innerHTML = panel('TROCA DE TURNO','DUELO 2P') + `<div class="duelbanner">PASSE O DISPOSITIVO PARA ${escapeHtml(duel.names[player])}</div>`;
    setTimeout(()=>{ duel.waiting=false; render(); }, 800);
    return;
  }

  el.innerHTML = panel(`DUELO · RODADA ${duel.turn+1} DE 10`,'COMBATE DIRETO') + `<div><strong>${escapeHtml(duel.names[player])}</strong></div><h3>${escapeHtml(q.q)}</h3><div id="duelAnswers"></div>`;
  const answersContainer = el.querySelector('#duelAnswers');
  q.a.forEach((text, idx)=>{
    const btn = document.createElement('button'); btn.type='button'; btn.className='answer'; btn.dataset.duelAnswer=idx; btn.textContent = text;
    if(!duel.answered) btn.onclick = ()=>answerDuel(Number(btn.dataset.duelAnswer), q);
    answersContainer.appendChild(btn);
  });

  if(duel.answered){
    const correctBtn = answersContainer.querySelector(`[data-duel-answer="${q.k}"]`);
    if(correctBtn) correctBtn.classList.add('correct');
    if(!duel.lastCorrect){ const wrongBtn = answersContainer.querySelector(`[data-duel-answer="${duel.lastChoice}"]`); if(wrongBtn) wrongBtn.classList.add('wrong'); }
  }
}

function answerDuel(choice, q){
  duel.answered = true; duel.lastChoice = choice; duel.lastCorrect = choice === q.k; if(duel.lastCorrect) duel.score[duel.turn%2]++;
  setTimeout(()=>{ duel.turn++; duel.answered=false; if(duel.turn>=duel.deck.length){ duel.complete=true; } else { duel.waiting=true; } render(); }, 900);
}

function renderCharacter(el){ el.innerHTML = panel('PERSONALIZAR HERÓI','PERSONAGEM') + `<p class="screenIntro">Escolha o visual para sua jornada.</p>`; }

function toast(message){ const t = $('toast'); t.textContent = message; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }

document.body.insertAdjacentHTML('afterbegin', `<nav class="modebar"><button class="modebtn active" data-mode="solo" type="button">⚔ CAMPANHA SOLO</button><button class="modebtn" data-mode="duel" type="button">DUELO</button><button class="modebtn" data-mode="character" type="button">PERSONAGEM</button></nav>`);
document.querySelectorAll('.modebtn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

document.addEventListener('click', (e)=>{
  if(e.target && e.target.dataset && e.target.dataset.home!==undefined){ setMode('home'); }
});

// control buttons
// reset and sound handlers

document.addEventListener('DOMContentLoaded', ()=>{ render(); });
</script>
</body>
</html>
